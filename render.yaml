# Disposable synthetic demo only. Render Free has no persistent disk.
services:
  - type: web
    name: pos-ai-first
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    region: oregon
    plan: free
    envVars:
      - key: APP_ENV
        value: local
      - key: DATABASE_PATH
        value: /data/pos.db # Ephemeral container storage; fresh seed after replacement.
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # No AI credentials: chat reports unavailable without making external calls.
      - key: OPENROUTER_API_KEY
        value: ""
      - key: QUERY_TIMEOUT_SECONDS
        value: "5"
      - key: PIN_MAX_ATTEMPTS
        value: "5"
      - key: PIN_LOCKOUT_MINUTES
        value: "5"
    autoDeploy: false # Deploy only the explicitly verified source boundary.
    healthCheckPath: /health
