{{define "products/form.html"}}
<form
    method="POST"
    action="{{if .IsEdit}}/productos/{{.Product.ID}}{{else}}/productos{{end}}"
    hx-post="{{if .IsEdit}}/productos/{{.Product.ID}}{{else}}/productos{{end}}"
    hx-target="{{if .IsEdit}}#product-{{.Product.ID}}{{else}}#product-list{{end}}"
    hx-swap="{{if .IsEdit}}outerHTML{{else}}afterbegin{{end}}"
    class="space-y-4 p-4 bg-white rounded-xl shadow-sm border border-gray-100"
>
    <h3 class="text-lg font-bold text-gray-800">
        {{if .IsEdit}}{{call .T "page.products.edit"}}{{else}}{{call .T "page.products.new"}}{{end}}
    </h3>

    <div id="form-errors"></div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">{{call .T "product.form.name"}} *</label>
            <input type="text" id="nombre" name="nombre" value="{{.Product.Nombre}}" required
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border"/>
        </div>
        <div>
            <label for="sku" class="block text-sm font-medium text-gray-700 mb-1">{{call .T "product.form.sku"}}</label>
            <input type="text" id="sku" name="sku" value="{{.Product.SKU}}"
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border"/>
        </div>
        <div>
            <label for="precio_venta" class="block text-sm font-medium text-gray-700 mb-1">{{call .T "product.form.sale_price"}} *</label>
            <input type="number" id="precio_venta" name="precio_venta" value="{{printf "%.2f" .Product.PrecioVenta}}" step="0.01" min="0.01" required
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border"/>
        </div>
        <div>
            <label for="precio_compra" class="block text-sm font-medium text-gray-700 mb-1">{{call .T "product.form.purchase_price"}}</label>
            <input type="number" id="precio_compra" name="precio_compra" value="{{printf "%.2f" .Product.PrecioCompra}}" step="0.01" min="0"
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border"/>
        </div>
        <div>
            <label for="stock_actual" class="block text-sm font-medium text-gray-700 mb-1">{{call .T "product.form.stock"}}</label>
            <input type="number" id="stock_actual" name="stock_actual" value="{{printf "%.0f" .Product.StockActual}}" step="0.01" min="0"
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border"/>
        </div>
        <div>
            <label for="stock_minimo" class="block text-sm font-medium text-gray-700 mb-1">{{call .T "product.form.min_stock"}}</label>
            <input type="number" id="stock_minimo" name="stock_minimo" value="{{printf "%.0f" .Product.StockMinimo}}" step="0.01" min="0"
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border"/>
        </div>
        <div>
            <label for="unidad" class="block text-sm font-medium text-gray-700 mb-1">{{call .T "product.form.unit"}}</label>
            <select id="unidad" name="unidad" class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border">
                <option value="unidad" {{if eq (printf "%s" .Product.Unidad) "unidad"}}selected{{end}}>{{call .T "product.unit.unit"}}</option>
                <option value="kg"     {{if eq (printf "%s" .Product.Unidad) "kg"}}selected{{end}}>{{call .T "product.unit.kg"}}</option>
                <option value="litro"  {{if eq (printf "%s" .Product.Unidad) "litro"}}selected{{end}}>{{call .T "product.unit.liter"}}</option>
                <option value="paquete"{{if eq (printf "%s" .Product.Unidad) "paquete"}}selected{{end}}>{{call .T "product.unit.package"}}</option>
            </select>
        </div>
        <div>
            <label for="categoria_id" class="block text-sm font-medium text-gray-700 mb-1">{{call .T "product.form.category"}}</label>
            <input type="number" id="categoria_id" name="categoria_id" value="{{.Product.CategoriaID}}" min="0"
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border"/>
        </div>
    </div>

    <div class="flex gap-2 pt-2">
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium transition-colors">
            {{call .T "product.form.save"}}
        </button>
        <button type="button" onclick="document.getElementById('product-form-area').innerHTML=''"
                class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 text-sm font-medium transition-colors">
            {{call .T "product.form.cancel"}}
        </button>
    </div>
</form>
{{end}}
