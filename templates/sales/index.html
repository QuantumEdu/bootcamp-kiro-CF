<div class="space-y-4" x-data="salesCart()" @add-to-cart.window="addItem($event.detail)">
    <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold text-gray-800">{{call .T "sales.new"}}</h2>
    </div>
    <div id="sale-feedback"></div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="lg:col-span-2 space-y-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <input type="search" placeholder="{{call .T "sales.search"}}" x-model="search"
                       hx-get="/api/productos/buscar" hx-target="#product-results" hx-trigger="keyup changed delay:300ms" name="q"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                <div id="product-results" class="mt-3 space-y-1 max-h-64 overflow-y-auto"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <h3 class="font-semibold text-gray-700 mb-3">{{call .T "sales.available"}}</h3>
                <div hx-get="/api/productos" hx-trigger="load" hx-swap="innerHTML">
                    <div class="animate-pulse space-y-2"><div class="h-3 bg-gray-200 rounded w-full"></div><div class="h-3 bg-gray-200 rounded w-4/5"></div></div>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col">
            <h3 class="font-semibold text-gray-700 mb-3">{{call .T "sales.cart"}} <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full" x-text="items.length + ' {{call .T "sales.items"}}'"></span></h3>
            <div class="flex-1 space-y-2 overflow-y-auto max-h-72">
                <template x-for="(item, index) in items" :key="index">
                    <div class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg text-sm">
                        <div class="flex-1 min-w-0">
                            <p class="font-medium text-gray-800 truncate" x-text="item.nombre"></p>
                            <p class="text-xs text-gray-500">$<span x-text="item.precio.toFixed(2)"></span> x <span x-text="item.cantidad"></span></p>
                        </div>
                        <div class="flex items-center gap-1">
                            <button @click="decrementItem(index)" class="w-6 h-6 bg-gray-200 rounded text-xs font-bold hover:bg-gray-300">-</button>
                            <span class="w-6 text-center text-xs" x-text="item.cantidad"></span>
                            <button @click="incrementItem(index)" class="w-6 h-6 bg-gray-200 rounded text-xs font-bold hover:bg-gray-300">+</button>
                        </div>
                        <button @click="removeItem(index)" class="text-red-400 hover:text-red-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                </template>
                <div x-show="items.length === 0" class="text-center text-gray-400 py-8 text-sm">{{call .T "sales.cart.empty"}}</div>
            </div>
            <div class="border-t border-gray-200 pt-3 mt-3 space-y-3">
                <div class="flex justify-between text-lg font-bold text-gray-900"><span>{{call .T "sales.total"}}</span><span>$<span x-text="total().toFixed(2)"></span></span></div>
                <select x-model="metodoPago" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="efectivo">{{call .T "sales.payment.cash"}}</option>
                    <option value="tarjeta">{{call .T "sales.payment.card"}}</option>
                    <option value="transferencia">{{call .T "sales.payment.transfer"}}</option>
                </select>
                <button @click="checkout()" :disabled="items.length === 0"
                        :class="items.length === 0 ? 'bg-gray-300 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700'"
                        class="w-full py-3 text-white rounded-lg font-medium transition-colors">{{call .T "sales.checkout"}}</button>
            </div>
        </div>
    </div>
</div>

<script>
function salesCart() {
    return {
        items: [],
        search: '',
        metodoPago: 'efectivo',
        loading: false,
        addItem(detail) {
            const existing = this.items.find(i => i.producto_id === detail.id);
            if (existing) { existing.cantidad++; }
            else { this.items.push({ producto_id: detail.id, nombre: detail.nombre, precio: detail.precio, cantidad: 1 }); }
        },
        incrementItem(index) { this.items[index].cantidad++; },
        decrementItem(index) {
            if (this.items[index].cantidad > 1) { this.items[index].cantidad--; }
            else { this.items.splice(index, 1); }
        },
        removeItem(index) { this.items.splice(index, 1); },
        total() { return this.items.reduce((sum, item) => sum + (item.precio * item.cantidad), 0); },
        async checkout() {
            if (this.items.length === 0 || this.loading) return;
            this.loading = true;
            try {
                const payload = {
                    items: this.items.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad })),
                    metodo_pago: this.metodoPago
                };
                const resp = await fetch('/ventas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'HX-Request': 'true' },
                    body: JSON.stringify(payload)
                });
                const feedback = document.getElementById('sale-feedback');
                if ((resp.headers.get('Content-Type') || '').includes('application/json')) {
                    const result = await resp.json();
                    feedback.textContent = result.success
                        ? {{call .T "sales.success"}} + ' #' + result.id + ' — $' + result.total.toFixed(2)
                        : result.error;
                } else {
                    feedback.innerHTML = await resp.text();
                }
                if (resp.ok) {
                    this.items = [];
                    document.body.dispatchEvent(new CustomEvent('ventaCreada'));
                }
            } catch (e) {
                document.getElementById('sale-feedback').textContent = {{call .T "sales.error.connection"}};
            } finally {
                this.loading = false;
            }
        }
    };
}
</script>
